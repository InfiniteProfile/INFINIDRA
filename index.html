<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="An endless, deterministic universe of digital identities. Every identifier opens a different door.">
<title>INFINIDRA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050507'/%3E%3Cpath d='M16 5l10 11-10 11L6 16z' fill='none' stroke='%238b6fe0' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a id="home" href="#1" aria-label="INFINIDRA – return to identity 1">INFINIDRA</a>
  <button id="sb" type="button" aria-label="Search by identity number" aria-expanded="false" aria-controls="ov">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
  </button>
</header>
<main id="feed" aria-label="Identities"></main>
<div id="ov" hidden>
  <form id="sf" autocomplete="off">
    <label for="q">Identity number</label>
    <div class="row">
      <input id="q" type="text" inputmode="numeric" spellcheck="false" autocapitalize="off" placeholder="Any positive integer">
      <button type="submit">Open</button>
    </div>
    <p id="err" role="alert"></p>
  </form>
</div>
<noscript><p style="padding:5rem 1rem;color:#aaa">INFINIDRA generates identities in your browser and needs JavaScript.</p></noscript>
<script src="script.js" defer></script>
</body>
</html>
